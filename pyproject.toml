[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasyoptimizer"
version = "0.1.0"
description = "Analyze historical fantasy-football ADP and results to identify draft value."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "streamlit>=1.30,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

