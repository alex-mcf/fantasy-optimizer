[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasyoptimizer"
version = "0.1.0"
description = "Forecast fantasy-football market errors and support evidence-based draft decisions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "requests>=2.31,<3",
    "streamlit>=1.30,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
